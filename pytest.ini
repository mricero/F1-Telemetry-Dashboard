[pytest]
testpaths = tests
# src layout (REPO-10): the tests import f1dash from the checkout, no install needed.
pythonpath = src
# Deselected by default, each run in its own CI job: wall-clock budgets
# (`pytest -m perf`, TEST-04) and the start-the-real-server smoke test
# (`pytest -m smoke`, DIST-02). --strict-markers: a misspelt marker is an error.
addopts = -q -m "not perf and not smoke" --strict-markers
markers =
    network: requires internet access (opt-in via F1_NETWORK_TESTS=1)
    perf: wall-clock budgets; deselected by default, run with -m perf
    smoke: starts the real Streamlit server; deselected by default, run with -m smoke
# TEST-06: a warning is an error, so deprecations surface while they are
# still warnings. Each ignore names what it covers and why it cannot be fixed
# here.
filterwarnings =
    error
    # FastF1's HTTP cache (requests-cache, SQLite backend) is rebuilt per temp
    # directory in tests; the replaced session's connection is closed by GC.
    ignore:unclosed database:ResourceWarning
    ignore:Exception ignored while finalizing database connection:pytest.PytestUnraisableExceptionWarning
    # FastF1 calls pd.Timedelta / to_timedelta with bare numbers internally
    # (core.py); NumPy 2.5 deprecates that on pandas 2.x. Ours are fixed
    # (CORE-01); this goes when FastF1 or pandas 3 does (REPO-19).
    ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning:fastf1
