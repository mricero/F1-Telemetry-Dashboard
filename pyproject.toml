[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "f1dash"
# The one place the version is written (REPO-23). config.__version__ reads it
# back: from the installed metadata, or from this file in a checkout.
version = "0.9.0"
description = "Formula 1 replay, timing and telemetry dashboard built on Streamlit"
readme = "readme.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "F1 Telemetry Dashboard Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Equal to requirements.txt, which stays the file the locks are compiled
# from; tests/test_packaging.py fails when the two drift (DIST-01).
dependencies = [
    "streamlit>=1.55,<2",
    "plotly>=5.22,<8",
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.6",
    "fastf1>=3.8.0,<4",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "pyarrow>=16,!=25.0.0,<26",
    "websockets>=15,<17",
    "platformdirs>=4,<5",
]

[project.urls]
Homepage = "https://github.com/mricero/F1-Telemetry-Dashboard"
Changelog = "https://github.com/mricero/F1-Telemetry-Dashboard/blob/main/CHANGELOG.md"

[project.scripts]
f1dash = "f1dash.cli:main"

[tool.hatch.build.targets.wheel]
# src layout (REPO-10): the wheel holds the one f1dash package. The player's
# js/css/html and the fonts are package data found next to their modules.
packages = ["src/f1dash"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
# Streamlit reads .streamlit/config.toml from the working directory, so the
# checkout keeps it at the root; the wheel carries a copy inside the package,
# where f1dash.cli finds it and passes it to `streamlit run` as flags.
".streamlit/config.toml" = "f1dash/.streamlit/config.toml"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/f1dash",
    "app.py",
    ".streamlit/config.toml",
    "pyproject.toml",
    "readme.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "requirements.txt",
]
exclude = ["__pycache__", "*.pyc"]

[tool.black]
line-length = 100
# 3.11 is the declared floor (readme). Targeting py312 made black warn
# "Python 3.11 cannot parse code formatted for Python 3.12" on that floor.
target-version = ["py311"]
# Black's defaults cover .venv but not these; without them `black --check .`
# walks the vendored site-packages and fails CI on third-party code.
extend-exclude = '''
/(
    \.venv311
  | ff1_cache
  | replay_sessions
  | test_cache
  | \.claude
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".venv311", "ff1_cache", "replay_sessions", ".claude"]

[tool.ruff.lint]
# Beyond the defaults, these are the rules that would have caught bugs this
# project actually shipped: S (bandit) flags the pickle replay loader, DTZ
# the naive datetimes behind earlier timezone bugs, PD pandas anti-patterns,
# B mutable defaults and loop-variable capture. Style stays with black.
select = [
    "E4", "E7", "E9", "F",  # pyflakes + the pycodestyle errors black leaves
    "B",                     # bugbear
    "UP",                    # pyupgrade
    "SIM",                   # flake8-simplify
    "I",                     # isort
    "PD",                    # pandas-vet
    "NPY",                   # numpy-specific
    "PERF",                  # perflint
    "RUF",                   # ruff-specific
    "S",                     # bandit
    "DTZ",                   # naive datetimes
]
ignore = [
    # assert is how tests state their expectations.
    "S101",
]
# The en dash is the UI guideline's missing-value glyph and range separator
# (IMPROVEMENTS.md 5.7), so it is intended wherever it appears.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts, temp paths and non-cryptographic randomness freely.
"tests/*" = ["S", "DTZ", "PERF"]
# Exploration scripts print and read from the network by design.
"scripts/*" = ["S", "DTZ"]

[tool.mypy]
# No python_version pin: it makes mypy parse installed stubs under that
# version's rules, and numpy's stubs use 3.12 syntax. The supported range is
# enforced by CI's matrix instead.
ignore_missing_imports = true
# Adding a new implicit-Optional default should fail, not accumulate.
no_implicit_optional = true

[[tool.mypy.overrides]]
# f1dash.processing is pure transforms over DataFrames: no Streamlit, no network,
# so it is the package that can carry stricter checking first.
module = "f1dash.processing.*"
check_untyped_defs = true
