# Dark theme matching ui/theme.py (IMPROVEMENTS.md UI-01, guideline 5.4).
[theme]
# Guideline 5.6: radius <= 4 px, Streamlit widgets included (default 0.5rem).
baseRadius = "4px"
base = "dark"
primaryColor = "#e10600"
backgroundColor = "#0b0c0f"
secondaryBackgroundColor = "#13151a"
textColor = "#eceef1"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
runOnSave = false

[browser]
# REPO-22: Streamlit otherwise sends usage statistics from every viewer's
# browser, which breaks "no external requests" (IMPROVEMENTS.md 0.5, 5.2).
gatherUsageStats = false
