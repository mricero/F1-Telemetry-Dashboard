name: Release

# A pushed v* tag builds the wheel and sdist, checks the tag against the
# package version, smoke-installs the wheel as a uv tool on Windows and
# Linux, and creates the GitHub Release with the installers and the
# CHANGELOG section as notes (DIST-06). PyPI publishing is opt-in: set the
# repository variable PUBLISH_TO_PYPI to "true" once trusted publishing is
# configured for the f1dash name.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Read the package version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag names the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${{ steps.version.outputs.version }}"
            exit 1
          fi
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the wheel as a tool and ask for its version
        shell: bash
        run: |
          wheel=$(ls dist/*.whl)
          uv tool install --python 3.12 "$wheel"
          uvx --python 3.12 --from "$wheel" f1dash --version | tee version.txt
          grep -q "${{ needs.build.outputs.version }}" version.txt

  release:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release notes from the CHANGELOG section
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path

          version = "${{ needs.build.outputs.version }}"
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M
          )
          Path("notes.md").write_text(
              match.group(1).strip() if match else f"Release {version}", encoding="utf-8"
          )
          EOF
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* install.ps1 install.sh \
            --title "${GITHUB_REF_NAME}" --notes-file notes.md

  pypi:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish with trusted publishing
        run: uv publish
