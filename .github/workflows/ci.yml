name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    # The lock must be what requirements*.txt resolve to: re-compile it and
    # fail on any difference (REPO-20). `pip install --dry-run --no-deps`
    # used to stand in for this and could never fail.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Re-lock and compare
        run: |
          python scripts/lock_requirements.py
          git diff --exit-code -- requirements.lock requirements-dev.lock

  lint-and-test:
    needs: lock
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor the readme promises, through to the newest supported, and
        # the maintainer's own Windows + 3.14 combination (TEST-09).
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Ruff
        run: python -m ruff check .

      - name: Black (formatting check)
        run: python -m black --check .

      - name: Mypy
        run: python -m mypy --ignore-missing-imports src

      - name: Pytest
        env:
          # An absolute path: "~" is not expanded here, and a literal
          # ./~/.cache/fastf1 used to appear in the checkout (TEST-08).
          FASTF1_CACHE_DIR: ${{ runner.temp }}/fastf1
        # mypy already ran above; tests/test_type_checking.py repeats it.
        # The floor sits a few points under the measured coverage (TEST-05).
        run: python -m pytest --cov=f1dash.data --cov=f1dash.processing --cov=f1dash.ui --cov-report=term --cov-fail-under=75 --deselect tests/test_type_checking.py

      - name: The run left the working tree as it found it
        # TEST-08: tests write only under tmp_path.
        shell: bash
        run: |
          git status --porcelain --ignored \
            | grep -vE '__pycache__|\.pytest_cache|\.hypothesis|\.mypy_cache|\.ruff_cache|^!! \.coverage' \
            > "$RUNNER_TEMP/stray.txt" || true
          if [ -s "$RUNNER_TEMP/stray.txt" ]; then cat "$RUNNER_TEMP/stray.txt"; exit 1; fi

  perf:
    # Wall-clock budgets, deselected from the main run (TEST-04, TEST-07): a
    # busy shared runner then fails only this job, and the result is visible.
    # The real-server smoke test runs here too, for the same reason.
    needs: lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Performance budgets
        env:
          FASTF1_CACHE_DIR: ${{ runner.temp }}/fastf1
        run: python -m pytest -m perf
      - name: f1dash serves the app (DIST-02)
        env:
          FASTF1_CACHE_DIR: ${{ runner.temp }}/fastf1
        run: python -m pytest -m smoke

  js:
    # The replay player's JavaScript, tested with Node's own runner (TEST-09).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        if: hashFiles('tests/js/package.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/js/package-lock.json
      - name: npm ci
        if: hashFiles('tests/js/package.json') != ''
        working-directory: tests/js
        run: npm ci
      - name: node --test
        if: hashFiles('tests/js/package.json') != ''
        working-directory: tests/js
        run: node --test

  package:
    # The wheel carries everything the app needs, and installs as a tool that
    # starts (DIST-01, DIST-02).
    needs: lock
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Install the wheel as a tool
        shell: bash
        run: |
          uv tool install --python 3.12 dist/*.whl
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: f1dash --version
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          f1dash --version
          f1dash paths

  installers:
    # install.ps1 / install.sh from the checkout, twice: a re-run updates
    # (DIST-04).
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: install.ps1 (twice)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          F1DASH_SOURCE: ${{ github.workspace }}
          F1DASH_NO_SHORTCUT: "1"
        run: |
          ./install.ps1
          ./install.ps1
          $bin = (uv tool dir --bin)
          & (Join-Path $bin "f1dash.exe") --version
      - name: install.sh (twice)
        if: runner.os != 'Windows'
        env:
          F1DASH_SOURCE: ${{ github.workspace }}
        run: |
          sh install.sh
          sh install.sh
          "$(uv tool dir --bin 2>/dev/null || echo "$HOME/.local/bin")/f1dash" --version

  audit:
    # Known vulnerabilities in the locked runtime packages (TEST-09).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: pip-audit
        # PYSEC-2026-3625: msgpack 1.1.2 arrives through FastF1 -> signalrcore.
        # This app never unpacks msgpack (the live feed is JSON), and the fix
        # (1.2.1) waits on signalrcore. Remove the ignore when the lock moves.
        run: uvx pip-audit --strict --disable-pip --no-deps -r requirements.lock --ignore-vuln PYSEC-2026-3625
