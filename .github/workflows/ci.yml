name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the readme promises, through to the newest supported.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The lock is what CI must reproduce: floors alone let CI and
      # contributors resolve different versions, and a livef1 patch release
      # has already changed parsing shapes under this project once.
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Check the lock satisfies the declared requirements
        run: pip install --dry-run --no-deps -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black (formatting check)
        run: black --check .

      - name: Pytest
        env:
          FASTF1_CACHE_DIR: ~/.cache/fastf1
        run: pytest -v
