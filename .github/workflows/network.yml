name: Network tests

# The opt-in tests that reach FastF1, Jolpica and the full app (TEST-03).
# They never run in the main CI: upstream outages would turn every PR red.
# Nightly instead, with an issue opened when they fail.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-tests
  cancel-in-progress: false

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: FastF1 cache
        # FastF1 downloads a session once; later runs read it from here, which
        # keeps the run short and friendly to the upstream API.
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/fastf1
          key: fastf1-${{ hashFiles('requirements.lock') }}-${{ github.run_id }}
          restore-keys: |
            fastf1-${{ hashFiles('requirements.lock') }}-
            fastf1-

      - name: Network tests
        env:
          F1_NETWORK_TESTS: "1"
          FASTF1_CACHE_DIR: ${{ runner.temp }}/fastf1
        run: python -m pytest -m network

  report:
    # One open issue per failure streak: comment on it rather than opening
    # a new one every night.
    needs: network
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly network tests failed"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          body="The nightly network tests failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
