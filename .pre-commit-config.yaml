# Run the same gates CI runs, before the commit rather than after it.
#   python -m pip install --require-hashes -r requirements-dev.lock && pre-commit install
# The ruff and black revs equal the versions in requirements-dev.lock
# (tests/test_pre_commit_config.py checks it), so the hook and CI agree.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # Formatting is black's job here; ruff only lints.
        stages: [manual]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: local
    hooks:
      # REPO-21: the mirrors-mypy hook ran in an isolated env with unpinned
      # pandas-stubs and no numpy/streamlit, and reported 156 errors CI never
      # saw. This runs the CI command with the project's own interpreter.
      - id: mypy
        name: mypy
        entry: python -m mypy --ignore-missing-imports app.py data processing ui
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # A committed virtualenv is how REPO-01 happened.
      - id: check-added-large-files
        args: [--maxkb=512]
