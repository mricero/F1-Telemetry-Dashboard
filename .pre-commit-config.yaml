# Run the same gates CI runs, before the commit rather than after it.
#   pip install -r requirements-dev.txt && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Formatting is black's job here; ruff only lints.
        stages: [manual]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # processing/ is pure transforms, so it type-checks cleanly first.
        files: ^processing/
        args: [--ignore-missing-imports]
        additional_dependencies: [pandas-stubs, types-requests]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # A committed virtualenv is how REPO-01 happened.
      - id: check-added-large-files
        args: [--maxkb=512]
